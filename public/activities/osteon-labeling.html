<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osteon (Haversian system): label the structures</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2733; --muted:#5b6876; --paper:#ffffff; --wash:#f2f5f8; --line:#d5dce4;
  --chip:#e8eef5; --chip-ink:#1d2733; --sel:#2b5fa8;
  --ok:#0f7a5c; --ok-wash:#e3f4ee; --miss:#b4233c; --miss-wash:#fbe6ea;
  --font:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:10px}
h1{font-size:1.45rem;margin:0}
.how{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.stats{display:flex;gap:18px;font-size:.95rem;color:var(--muted)}
.stats b{color:var(--ink);font-size:1.1rem}
.bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar span{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}

.figure{position:relative;width:100%;aspect-ratio:2320 / 2680;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.figure img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.spot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:none;padding:0;background:transparent;cursor:pointer;color:transparent;font:700 clamp(9px,1.25vw,15px) var(--font)}
.spot:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.spot.hot{box-shadow:0 0 0 4px var(--sel)}
.spot.done{background:var(--ok);color:#fff;box-shadow:0 0 0 2px #fff}
.spot.bad{animation:shake .35s;box-shadow:0 0 0 4px var(--miss)}

.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;margin-top:16px}
@media (max-width:760px){.work{grid-template-columns:1fr}}
h2{font-size:1.05rem;margin:0 0 8px}
.bank{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:60px;padding:12px;background:var(--wash);border-radius:8px}
.chip{border:1px solid #c3cdd8;background:var(--paper);color:var(--chip-ink);border-radius:6px;padding:7px 11px;font:400 .95rem var(--font);cursor:grab;touch-action:none;user-select:none}
.chip:hover{border-color:var(--sel)}
.chip:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.chip.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.chip.lift{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--sel);color:#fff;border-radius:6px;padding:7px 11px;font:700 .95rem var(--font);box-shadow:0 6px 18px rgba(20,40,70,.25);transform:translate(-50%,-60%)}
.bank-empty{color:var(--muted);font-size:.95rem;padding:4px}

.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;list-style:none;margin:0;padding:0}
@media (max-width:420px){.slots{grid-template-columns:1fr}}
.slot{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:4px 8px 4px 4px;border:1.5px dashed #b8c3cf;border-radius:6px;background:var(--paper);font:400 .95rem var(--font);color:var(--muted);text-align:left;cursor:pointer}
.slot .num{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--ink);background:#fff}
.slot.hot{border-color:var(--sel);border-style:solid;background:#eaf1fb}
.slot:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
.slot.done{border:1.5px solid var(--ok);background:var(--ok-wash);color:var(--ink);cursor:default}
.slot.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.slot.bad{animation:shake .35s;border-color:var(--miss);border-style:solid;background:var(--miss-wash)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toast{min-height:1.4em;margin:10px 0 0;font-size:.95rem}
.toast.miss{color:var(--miss)} .toast.ok{color:var(--ok)}

.finish{display:none;margin-top:16px;padding:16px;border-radius:8px;background:var(--ok-wash);border:1px solid #b9e0d2}
.finish.show{display:block}
.finish p{margin:0 0 10px}
button.action{font:700 .95rem var(--font);padding:9px 16px;border-radius:6px;border:none;background:var(--ink);color:#fff;cursor:pointer}
button.action:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.foot{display:flex;justify-content:flex-end;margin-top:12px}
button.link{font:400 .9rem var(--font);background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.slot.bad,.spot.bad{animation:none}.bar span{transition:none}}
</style>
</head>

   "y": 97.76
  },
  {
   "n": 5,
   "term": "Lacuna",
   "x": 28.45,
   "y": 97.76
  }
 ]
};
/* ========================================================================= */

const $ = id => document.getElementById(id);
const figure = $('figure'), bank = $('bank'), slotsEl = $('slots'), toast = $('toast');
let state, selected = null, drag = null;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function build(){
  state = {done:new Set(), misses:0, missedTerms:new Set(), start:Date.now()};
  selected = null;
  $('total').textContent = ITEM.items.length;
  figure.querySelectorAll('.spot').forEach(e=>e.remove());
  ITEM.items.forEach(it=>{
    const b = document.createElement('button');
    b.className='spot'; b.dataset.n=it.n; b.type='button';
    b.style.left=it.x+'%'; b.style.top=it.y+'%'; b.style.width=(ITEM.r*2.25)+'%';
    b.setAttribute('aria-label','Structure '+it.n);
    b.textContent=it.n;
    b.addEventListener('click',()=>tapTarget(it.n));
    b.addEventListener('mouseenter',()=>hot(it.n,true)); b.addEventListener('mouseleave',()=>hot(it.n,false));
    figure.appendChild(b);
  });
  slotsEl.innerHTML='';
  ITEM.items.forEach(it=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.type='button'; b.className='slot'; b.dataset.n=it.n;
    b.innerHTML='<span class="num">'+it.n+'</span><span class="txt">&nbsp;</span>';
    b.setAttribute('aria-label','Label '+it.n+', empty');
    b.addEventListener('click',()=>tapTarget(it.n));
    b.addEventListener('mouseenter',()=>hot(it.n,true)); b.addEventListener('mouseleave',()=>hot(it.n,false));
    b.addEventListener('focus',()=>hot(it.n,true)); b.addEventListener('blur',()=>hot(it.n,false));
    li.appendChild(b); slotsEl.appendChild(li);
  });
  bank.innerHTML='';
  shuffle(ITEM.items).forEach(it=>{
    const c=document.createElement('button');
    c.type='button'; c.className='chip'; c.textContent=it.term; c.dataset.term=it.term;
    c.addEventListener('pointerdown',e=>startDrag(e,c));
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(c);}});
    bank.appendChild(c);
  });
  $('finish').classList.remove('show');
  say('','');
  update();
}

function hot(n,on){
  document.querySelectorAll('[data-n="'+n+'"]').forEach(e=>{ if(!e.classList.contains('done')) e.classList.toggle('hot',on); });
}
function say(msg,cls){toast.textContent=msg;toast.className='toast '+cls;}

function select(chip){
  if(selected===chip){chip.classList.remove('sel');selected=null;say('','');return;}
  if(selected) selected.classList.remove('sel');
  selected=chip; chip.classList.add('sel');
  say('Now tap a number on the photo or in your labels.','');
}
function tapTarget(n){ if(selected) attempt(selected,n); }

function attempt(chip,n){
  n=+n;
  if(state.done.has(n)) return;
  const term=chip.dataset.term;
  const it=ITEM.items.find(i=>i.n===n);
  const targets=document.querySelectorAll('[data-n="'+n+'"]');
  if(it.term===term){
    state.done.add(n);
    targets.forEach(t=>{t.classList.remove('hot','bad');t.classList.add('done');});
    const slot=slotsEl.querySelector('.slot[data-n="'+n+'"]');
    slot.querySelector('.txt').textContent=term; slot.setAttribute('aria-label','Label '+n+', '+term+', correct');
    figure.querySelector('.spot[data-n="'+n+'"]').setAttribute('aria-label','Structure '+n+', '+term);
    chip.remove(); selected=null;
    say('Correct: #'+n+' is '+term+'.','ok');
    if(!bank.querySelector('.chip')) bank.innerHTML='<span class="bank-empty">Word bank is empty.</span>';
  } else {
    state.misses++; state.missedTerms.add(term);
    targets.forEach(t=>{t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad');setTimeout(()=>t.classList.remove('bad'),400);});
    say(term+' is not #'+n+'. Try another spot.','miss');
    if(selected){selected.classList.remove('sel');selected=null;}
  }
  update();
}

function update(){
  const p=state.done.size, t=ITEM.items.length;
  $('placed').textContent=p; $('misses').textContent=state.misses;
  $('bar').style.width=(p/t*100)+'%';
  if(p===t) finish();
}

function finish(){
  const t=ITEM.items.length, first=t-state.missedTerms.size;
  const secs=Math.round((Date.now()-state.start)/1000);
  $('summary').textContent=first+' of '+t+' terms went on the first try, with '+state.misses+' missed '+(state.misses===1?'try':'tries')+'.';
  $('finish').classList.add('show');
  say('','');
  try{
    window.parent.postMessage({source:'bloom-practice', activity:ITEM.id, type:'complete',
      total:t, firstTry:first, misses:state.misses, missedTerms:[...state.missedTerms], seconds:secs},'*');
  }catch(e){}
}

/* ---- pointer drag (mouse, touch, pen) ---- */
function startDrag(e,chip){
  if(e.button!==undefined && e.button!==0) return;
  const sx=e.clientX, sy=e.clientY;
  drag={chip, sx, sy, ghost:null, over:null, id:e.pointerId};
  chip.setPointerCapture(e.pointerId);
  chip.addEventListener('pointermove',onMove);
  chip.addEventListener('pointerup',onUp,{once:true});
  chip.addEventListener('pointercancel',cancelDrag,{once:true});
}
function onMove(e){
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6) return;
    drag.ghost=document.createElement('div'); drag.ghost.className='ghost'; drag.ghost.textContent=drag.chip.dataset.term;
    document.body.appendChild(drag.ghost); drag.chip.classList.add('lift');
    if(selected){selected.classList.remove('sel');selected=null;}
  }
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  const n=targetAt(e.clientX,e.clientY);
  if(n!==drag.over){ if(drag.over) hot(drag.over,false); if(n) hot(n,true); drag.over=n; }
}
function targetAt(x,y){
  const el=document.elementFromPoint(x,y);
  const t=el && el.closest('.spot,.slot');
  if(t) return t.dataset.n;
  // forgiving drop on photo: nearest open spot within reach
  const r=figure.getBoundingClientRect();
  if(x<r.left||x>r.right||y<r.top||y>r.bottom) return null;
  let best=null,bd=1e9;
  ITEM.items.forEach(it=>{ if(state.done.has(it.n)) return;
    const d=Math.hypot(r.left+it.x/100*r.width-x, r.top+it.y/100*r.height-y);
    if(d<bd){bd=d;best=it.n;} });
  return bd < r.width*0.035 ? String(best) : null;
}
function onUp(e){
  const d=drag; if(!d) return;
  d.chip.removeEventListener('pointermove',onMove);
  if(!d.ghost){ drag=null; select(d.chip); return; }   // it was a tap
  const n=targetAt(e.clientX,e.clientY);
  if(d.over) hot(d.over,false);
  d.ghost.remove(); d.chip.classList.remove('lift'); drag=null;
  if(n) attempt(d.chip,n);
}
function cancelDrag(){ if(!drag) return; if(drag.ghost) drag.ghost.remove(); drag.chip.classList.remove('lift'); if(drag.over) hot(drag.over,false); drag=null; }

$('again').addEventListener('click',build);
$('reset').addEventListener('click',build);
build();
</script>
</body>
</html>
